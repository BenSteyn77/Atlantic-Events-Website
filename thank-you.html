<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Atlantic Seaboard Events & Decor</title>
<meta name="description" content="Thank you for contacting Atlantic Seaboard Events & Decor. Our team will be in touch shortly to discuss your event.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#2e2620">
<link rel="canonical" href="https://www.asbevents.co.za/thank-you.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1612;
  --warm: #2e2620;
  --gold: #c9a84c;
  --gold-lt: #e8d49a;
  --cream: #faf7f2;
  --white: #ffffff;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Jost', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { min-height: 100%; }
body {
  min-height: 100vh;
  margin: 0;
  font-family: var(--sans);
  font-weight: 300;
  color: var(--white);
  background: var(--warm);
  display: grid;
  place-items: center;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    linear-gradient(135deg, rgba(26, 22, 18, 0.88), rgba(46, 38, 32, 0.68)),
    url('Blue_and_white_wedding_by_Navyblur_photography_69_1.webp') center/cover no-repeat;
  z-index: -2;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.3;
  z-index: -1;
}
main {
  width: min(760px, calc(100% - 40px));
  padding: 80px 0;
  text-align: center;
}
.brand {
  display: inline-flex;
  flex-direction: column;
  line-height: 1;
  margin-bottom: 56px;
}
.wordmark {
  font-family: var(--serif);
  font-size: clamp(1.15rem, 3vw, 1.55rem);
  font-weight: 600;
  letter-spacing: 0.12em;
}
.sub {
  color: var(--gold-lt);
  font-size: 0.62rem;
  letter-spacing: 0.3em;
  margin-top: 8px;
  text-transform: uppercase;
}
.eyebrow {
  color: var(--gold-lt);
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.25em;
  margin-bottom: 22px;
  text-transform: uppercase;
}
h1 {
  font-family: var(--serif);
  font-size: clamp(3rem, 9vw, 5.5rem);
  font-weight: 300;
  line-height: 1.04;
  margin: 0 0 26px;
}
h1 em {
  color: var(--gold-lt);
  font-style: italic;
}
p {
  color: rgba(255,255,255,0.76);
  font-size: 1.04rem;
  line-height: 1.8;
  margin: 0 auto;
  max-width: 590px;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: center;
  margin-top: 44px;
}
a {
  color: inherit;
  text-decoration: none;
}
.btn-primary,
.btn-ghost {
  border-radius: 2px;
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.2em;
  padding: 16px 34px;
  text-transform: uppercase;
  transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
}
.btn-primary {
  background: var(--gold);
  color: var(--ink);
}
.btn-ghost {
  border: 1px solid rgba(255,255,255,0.44);
  color: rgba(255,255,255,0.86);
}
.btn-primary:hover,
.btn-ghost:hover {
  transform: translateY(-2px);
}
.btn-primary:hover { background: var(--gold-lt); }
.btn-ghost:hover { border-color: var(--gold-lt); color: var(--gold-lt); }
@media (max-width: 520px) {
  main { width: min(100% - 28px, 760px); padding: 56px 0; }
  .actions { flex-direction: column; }
  .btn-primary, .btn-ghost { width: 100%; }
}
</style>
</head>
<body>
<main>
  <a href="/" class="brand" aria-label="Atlantic Seaboard Events & Decor home">
    <span class="wordmark">ATLANTIC SEABOARD</span>
    <span class="sub">Events &amp; Decor</span>
  </a>
  <span class="eyebrow">Enquiry Received</span>
  <h1>Thank You,<br><em>We’ll Be in Touch</em></h1>
  <p>Your enquiry has been sent to Atlantic Seaboard Events &amp; Decor. One of our specialists will come back to you shortly to discuss your event, guest count and styling details.</p>
  <div class="actions">
    <a class="btn-primary" href="/">Back to Home</a>
    <a class="btn-ghost" href="https://wa.me/27651220814" target="_blank" rel="noopener">Chat on WhatsApp</a>
  </div>
</main>
</body>
</html>
